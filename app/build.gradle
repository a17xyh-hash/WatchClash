plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.watchclash.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.watchclash.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // 目标设备/安装环境为 32 位 armeabi-v7a
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Wear OS 官方组件：BoxInsetLayout（圆屏）/ WearableRecyclerView（表冠旋转滚动条）
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // gomobile 编出来的 mihomo.aar（CI 第 5 步产出）
    implementation files('libs/mihomo.aar')
}
