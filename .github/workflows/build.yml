name: Build Wear Clash APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Setup Android env
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk" || true
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Init gomobile
        run: gomobile init
      - name: Build mihomo AAR
        working-directory: ./mihomo-bridge
        run: |
          mkdir -p ../app/libs
          go mod tidy
          gomobile bind -v -target=android/arm64 -androidapi 26 -o ../app/libs/mihomo.aar .
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-clash-debug
          path: app/build/outputs/apk/debug/*.apk
